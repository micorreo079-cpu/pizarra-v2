plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ── Versión AUTOMÁTICA por compilación (para el OTA) ─────────────────────────
// Cada build genera una versión nueva sin tocar nada a mano:
// - otaVersionCode: segundos desde epoch (siempre crece; Android lo usa para
//   aceptar la actualización). Válido hasta ~2036 (límite de versionCode).
// - otaVersionName: fecha y hora legibles, p.ej. "1.2026.07.13.0145". El
//   servidor OTA compara este string: dos builds distintos nunca coinciden.
def otaVersionCode = (int) (new Date().getTime() / 1000L)
def otaVersionName = "1." + new Date().format("yyyy.MM.dd.HHmm")

android {
    namespace 'com.example.newdrawingapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.newdrawingapp"
        minSdkVersion 22
        targetSdkVersion 33
        versionCode otaVersionCode
        versionName otaVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++11"
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // ── Clave de firma OFICIAL (app/realboard-release.keystore) ─────────────
    // Es la MISMA clave con la que se firmaron las pizarras ya entregadas
    // (huella SHA256 EA:D5:79...): cualquier build firmada con ella actualiza
    // encima sin desinstalar. NO regenerar ni sustituir NUNCA este fichero:
    // una clave distinta obligaría a desinstalar la app en todas las pizarras.
    // Copia de seguridad en Documents/desarrollo/PIZARRA/keystore/.
    signingConfigs {
        realboard {
            storeFile file("realboard-release.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.realboard
            minifyEnabled false
            shrinkResources false
            debuggable true
            jniDebuggable true
            renderscriptDebuggable true
            zipAlignEnabled true
        }
        release {
            // Ofuscación activada: el código descompilado sale ilegible. Las
            // partes que no se pueden tocar (JNI de Sony y de la activación,
            // componentes del manifest) están protegidas en proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            // OJO: con debuggable=true R8 NO ofusca (solo encoge). Para que el
            // renombrado se aplique de verdad, la release no puede ser
            // depurable. El logcat sigue funcionando igual.
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.realboard
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.1"
    // Generación del código QR (Modo V2: anuncio por QR)
    implementation "com.google.zxing:core:3.5.3"
} 